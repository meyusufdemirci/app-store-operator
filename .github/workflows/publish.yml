name: Publish

# Tag-driven release: pushing 0.3.2 publishes app-store-operator@0.3.2 to npm and
# then registers the matching server.json with the official MCP registry.
# Tags in this repo carry no `v` prefix, so the tag name *is* the version.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: npm trusted publishing + provenance, MCP registry login
      contents: write # create the GitHub release for this tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; the LTS bundle may be older.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # --ignore-scripts skips the Playwright Chromium download from postinstall.
      # The smoke test only boots the server over stdio, so no browser is needed.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # package.json, server.json and server.json packages[0] must all match the tag.
      - name: Verify version consistency
        run: |
          VERSION="$GITHUB_REF_NAME"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          fail=0
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 is \"$2\" but the tag says \"$VERSION\""
              fail=1
            fi
          }
          check "package.json version"        "$(jq -r '.version' package.json)"
          check "server.json version"         "$(jq -r '.version' server.json)"
          check "server.json packages[0].version" "$(jq -r '.packages[0].version' server.json)"

          MCP_NAME="$(jq -r '.mcpName' package.json)"
          SERVER_NAME="$(jq -r '.name' server.json)"
          if [ "$MCP_NAME" != "$SERVER_NAME" ]; then
            echo "::error::package.json mcpName ($MCP_NAME) does not match server.json name ($SERVER_NAME)"
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "Version $VERSION is consistent across package.json and server.json."

      - name: Run smoke test
        run: npm run smoke

      # Auth is npm trusted publishing (OIDC) — the id-token below is exchanged for a
      # short-lived npm token, so no NPM_TOKEN secret exists. The trusted publisher is
      # registered against this repo *and this filename*: renaming publish.yml breaks it.
      # Provenance is attested automatically under trusted publishing.
      # Skipping an already-published version keeps re-runs of a failed job safe.
      - name: Publish package to npm
        run: |
          NAME="$(jq -r '.name' package.json)"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — skipping publish."
          else
            npm publish --access public
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # The io.github.meyusufdemirci/* namespace is proven by the OIDC token's repo
      # claim, so no registry secret is needed.
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      # Release notes are the CHANGELOG.md section whose heading matches the tag —
      # hand-written for users, not derived from commit subjects. A missing section
      # falls back to GitHub's auto-generated commit list so a release still appears,
      # but that fallback is the ugly path: keep the changelog current instead.
      # GITHUB_TOKEN is issued per run by Actions; it is not a repository secret.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping."
            exit 0
          fi

          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '
            $0 == "## " ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"

          if grep -q '[^[:space:]]' "$NOTES"; then
            gh release create "$VERSION" --title "$VERSION" --notes-file "$NOTES"
          else
            echo "::warning::CHANGELOG.md has no \"## $VERSION\" section — falling back to auto-generated notes."
            gh release create "$VERSION" --title "$VERSION" --generate-notes
          fi
